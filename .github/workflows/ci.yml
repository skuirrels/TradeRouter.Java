name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reject hard-coded sample road routes
        run: ./scripts/check-no-hardcoded-sample-routes.sh

      - name: Build, test and package
        run: mvn -B --no-transfer-progress verify

      - uses: actions/upload-artifact@v7
        with:
          name: traderouter-jar
          path: traderouter/target/traderouter-*.jar
          if-no-files-found: error

  library-tests-java-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Surefire forks the tests on Java 17; the second setup-java makes Maven itself run on 21.
      - id: jdk17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test the library on Java 17
        env:
          JDK17: ${{ steps.jdk17.outputs.path }}
        run: mvn -B --no-transfer-progress -pl traderouter test -Djvm="$JDK17/bin/java"

      - name: Check the tests ran on Java 17
        run: |
          failed=0
          for report in traderouter/target/surefire-reports/TEST-*.xml; do
            if ! grep -q 'name="java.specification.version" value="17"' "$report"; then
              echo "Not run on Java 17: $report"
              failed=1
            fi
          done
          exit "$failed"
