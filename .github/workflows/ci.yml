name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reject hard-coded sample road routes
        run: ./scripts/check-no-hardcoded-sample-routes.sh

      - name: Build, test and package
        run: mvn -B --no-transfer-progress verify

      - uses: actions/upload-artifact@v7
        with:
          name: traderouter-jar
          path: traderouter/target/traderouter-*.jar
          if-no-files-found: error
