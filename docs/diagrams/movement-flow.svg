<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1184" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="movement-flow-title movement-flow-desc">
  <title id="movement-flow-title">TradeRouter.Net movement flow</title>
  <desc id="movement-flow-desc">Flowchart showing a typed movement plan built into continuous legs, each leg's locations resolved, sea legs routed on the Marnet network and road, rail or air legs measured as straight great-circle lines with no lane points or choke points, each producing a leg feature, looping until all legs are done and returning a GeoJSON FeatureCollection with totals. Strips below show fluent API examples for a UK to Melbourne movement and a movement with an air leg.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6472"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a34a1"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f6f7f8"/>

  <!-- Connectors (before nodes) -->
  <line x1="600" y1="112" x2="600" y2="152" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="208" x2="600" y2="248" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="304" x2="600" y2="344" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Mode? -> Route on Marnet (sea, focal) -->
  <line x1="696" y1="384" x2="840" y2="384" stroke="#0a34a1" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Mode? -> Straight leg (road, rail, air) -->
  <line x1="504" y1="384" x2="360" y2="384" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Route on Marnet -> merge -->
  <path d="M940,412 V464 Q940,472 932,472 H608" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Straight leg -> merge -->
  <path d="M260,412 V464 Q260,472 268,472 H592" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- merge -> Leg feature -->
  <line x1="600" y1="476" x2="600" y2="504" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Leg feature -> More legs? -->
  <line x1="600" y1="560" x2="600" y2="600" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- More legs? YES -> back to Resolve locations -->
  <path d="M504,640 H88 Q80,640 80,632 V284 Q80,276 88,276 H500" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- More legs? NO -> FeatureCollection -->
  <line x1="600" y1="680" x2="600" y2="720" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Connector labels (masked, clear of strokes and nodes) -->
  <rect x="752" y="364" width="32" height="12" rx="2" fill="#f6f7f8"/>
  <text x="768" y="373" fill="#0a34a1" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEA</text>
  <rect x="380" y="364" width="104" height="12" rx="2" fill="#f6f7f8"/>
  <text x="432" y="373" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROAD · RAIL · AIR</text>
  <rect x="252" y="620" width="88" height="12" rx="2" fill="#f6f7f8"/>
  <text x="296" y="629" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES · NEXT LEG</text>
  <rect x="612" y="694" width="20" height="12" rx="2" fill="#f6f7f8"/>
  <text x="622" y="703" fill="#6c7484" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

  <!-- Start: typed movement plan (input oval) -->
  <rect x="500" y="64" width="200" height="48" rx="24" fill="#f6f7f8"/>
  <rect x="500" y="64" width="200" height="48" rx="24" fill="rgba(91,100,114,0.10)" stroke="#6c7484" stroke-width="1"/>
  <text x="600" y="86" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Movement plan</text>
  <text x="600" y="100" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Waypoint · TransportMode</text>

  <!-- Build typed legs -->
  <rect x="500" y="152" width="200" height="56" rx="6" fill="#f6f7f8"/>
  <rect x="500" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="178" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build typed legs</text>
  <text x="600" y="194" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pickup · main · delivery</text>

  <!-- Resolve locations -->
  <rect x="500" y="248" width="200" height="56" rx="6" fill="#f6f7f8"/>
  <rect x="500" y="248" width="200" height="56" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="274" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolve locations</text>
  <text x="600" y="290" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">coords · ports · UN/LOCODE</text>

  <!-- Decision: Mode? -->
  <polygon points="600,344 696,384 600,424 504,384" fill="#f6f7f8"/>
  <polygon points="600,344 696,384 600,424 504,384" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="388" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mode?</text>

  <!-- Route on Marnet (focal) -->
  <rect x="840" y="356" width="200" height="56" rx="6" fill="#f6f7f8"/>
  <rect x="840" y="356" width="200" height="56" rx="6" fill="rgba(10,52,161,0.08)" stroke="#0a34a1" stroke-width="1"/>
  <text x="940" y="382" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route on Marnet</text>
  <text x="940" y="398" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">16 knots · 24 h port dwell each end</text>

  <!-- Straight great-circle leg -->
  <rect x="160" y="356" width="200" height="56" rx="6" fill="#f6f7f8"/>
  <rect x="160" y="356" width="200" height="56" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="260" y="382" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Straight great-circle leg</text>
  <text x="260" y="398" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">road 60 · rail 80 · air 800 km/h</text>

  <!-- Merge point -->
  <circle cx="600" cy="472" r="4" fill="#181818"/>

  <!-- Leg feature -->
  <rect x="500" y="504" width="200" height="56" rx="6" fill="#f6f7f8"/>
  <rect x="500" y="504" width="200" height="56" rx="6" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="530" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leg feature</text>
  <text x="600" y="546" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">transit · CO2e · choke points</text>

  <!-- Decision: More legs? -->
  <polygon points="600,600 696,640 600,680 504,640" fill="#f6f7f8"/>
  <polygon points="600,600 696,640 600,680 504,640" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="644" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">More legs?</text>

  <!-- End: FeatureCollection (output oval) -->
  <rect x="500" y="720" width="200" height="48" rx="24" fill="#f6f7f8"/>
  <rect x="500" y="720" width="200" height="48" rx="24" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="600" y="742" fill="#181818" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FeatureCollection</text>
  <text x="600" y="756" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">totals · length by mode</text>

  <!-- Worked examples -->
  <line x1="40" y1="800" x2="1160" y2="800" stroke="rgba(24,24,24,0.10)" stroke-width="0.8"/>
  <text x="40" y="820" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKED EXAMPLE A · UK TO MELBOURNE, 12 T IN ONE 40-FOOT CONTAINER</text>
  <text x="40" y="844" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">MovementPlan.From(Waypoint.Place("GBLGW"))</text>
  <text x="40" y="860" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .PickupTo(Waypoint.Port("GBFXT"), TransportMode.Road)</text>
  <text x="40" y="876" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .ThenTo(Waypoint.Port("SGSIN"), TransportMode.Sea)</text>
  <text x="40" y="892" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .ThenTo(Waypoint.Port("AUMEL"), TransportMode.Sea)</text>
  <text x="40" y="908" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .DeliverTo(Waypoint.Place("AUMRS"), TransportMode.Road)</text>
  <text x="40" y="940" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">each UN/LOCODE appears once; continuity is carried by the plan</text>
  <text x="480" y="844" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">Leg  Kind      Mode  From   To      Distance  Transit h  CO2e kg  Choke points</text>
  <text x="480" y="860" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">1    Pickup    Road  GBLGW  GBFXT      139 km        2.3      154</text>
  <text x="480" y="876" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">2    Main      Sea   GBFXT  SGSIN   15,402 km      567.8    2,341  Gibraltar, Suez, Bab-el-Mandeb, Malacca</text>
  <text x="480" y="892" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">3    Main      Sea   SGSIN  AUMEL    7,300 km      294.4    1,110  Sunda</text>
  <text x="480" y="908" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">4    Delivery  Road  AUMEL  AUMRS      829 km       13.8      915  Melrose SA, 800 km inland</text>
  <text x="480" y="924" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" xml:space="preserve">Total                               23,670 km      878.3    4,520  = 36.6 days</text>
  <text x="480" y="940" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">Transit = 782.3 h travelling + 96 h in port, 24 h at each end of the two sea legs</text>
  <text x="40" y="988" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKED EXAMPLE B · A MOVEMENT WITH AN AIR LEG, 20 T</text>
  <text x="40" y="1012" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">MovementPlan.From(Waypoint.Place("GBLGW"))</text>
  <text x="40" y="1028" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .PickupTo(Waypoint.Airport("GBLHR"), TransportMode.Road)</text>
  <text x="40" y="1044" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .ThenTo(Waypoint.Airport("AUMEL"), TransportMode.Air)</text>
  <text x="40" y="1060" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">  .DeliverTo(Waypoint.Place("AUMRS"), TransportMode.Road)</text>
  <text x="480" y="1012" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">Leg  Kind      Mode  From   To      Distance  Transit h  CO2e kg  Choke points</text>
  <text x="480" y="1028" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">1    Pickup    Road  GBLGW  GBLHR       40 km        0.7       73  none, straight line</text>
  <text x="480" y="1044" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">2    Main      Air   GBLHR  AUMEL   16,927 km       21.2  213,280  none, straight great-circle line, no lane points</text>
  <text x="480" y="1060" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">3    Delivery  Road  AUMEL  AUMRS      829 km       13.8    1,526  none, straight line</text>
  <text x="480" y="1076" fill="#181818" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" xml:space="preserve">Total                               17,796 km       35.6  214,879  no port time on road or air legs</text>

  <!-- Legend strip -->
  <line x1="40" y1="1120" x2="1160" y2="1120" stroke="rgba(24,24,24,0.10)" stroke-width="0.8"/>
  <text x="40" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="1132" width="24" height="12" rx="6" fill="rgba(91,100,114,0.10)" stroke="#6c7484" stroke-width="1"/>
  <text x="160" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">START · END</text>
  <rect x="264" y="1132" width="16" height="12" rx="2" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="288" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">STEP</text>
  <polygon points="372,1132 384,1138 372,1144 360,1138" fill="#ffffff" stroke="#181818" stroke-width="1"/>
  <text x="392" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>
  <rect x="480" y="1132" width="16" height="12" rx="2" fill="rgba(10,52,161,0.08)" stroke="#0a34a1" stroke-width="1"/>
  <text x="504" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">ROUTED ON THE NETWORK</text>
  <circle cx="672" cy="1138" r="4" fill="#181818"/>
  <text x="684" y="1144" fill="#5b6472" font-size="8" font-family="'Geist Mono', monospace">MERGE</text>
</svg>
